<div class="container d-flex justify-content-center align-items-center min-vh-100 py-5">
  <div class="card shadow-lg border-0 p-4 p-md-5" style="width: 100%; max-width: 440px; border-radius: 20px;">
    <div class="card-body p-0">
      
      <!-- Icon & Header -->
      <div class="text-center mb-4">
        <div class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-circle shadow-sm mb-3" style="width: 56px; height: 56px; background: linear-gradient(135deg, #4f46e5, #ec4899) !important;">
          <i class="bi bi-shield-lock-fill fs-3"></i>
        </div>
        <h3 class="card-title fw-bold text-dark mb-1">Welcome Back</h3>
        <p class="text-muted small">Sign in to manage your account & orders</p>
      </div>

      <div *ngIf="loginErrorMessage" class="alert alert-danger d-flex align-items-center small py-2 px-3 rounded-3 mb-3">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <div>{{ loginErrorMessage }}</div>
      </div>        
      
      <form (ngSubmit)="login()">
        <div class="mb-3">
          <label for="username" class="form-label small fw-semibold text-secondary">Username</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0 rounded-start-pill text-muted px-3">
              <i class="bi bi-person"></i>
            </span>
            <input
              type="text"
              id="username"
              [(ngModel)]="username"
              name="username"
              class="form-control bg-light border-start-0 rounded-end-pill py-2"
              placeholder="Enter your username"
              required />
          </div>
        </div>

        <div class="mb-4">
          <label for="password" class="form-label small fw-semibold text-secondary">Password</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0 rounded-start-pill text-muted px-3">
              <i class="bi bi-lock"></i>
            </span>
            <input
              type="password"
              id="password"
              [(ngModel)]="password"
              name="password"
              class="form-control bg-light border-start-0 rounded-end-pill py-2"
              placeholder="Enter your password"
              required />
          </div>
        </div>

        <div class="d-grid mb-3">
          <button type="submit" class="btn btn-primary rounded-pill py-2.5 fw-semibold shadow-sm">
            <i class="bi bi-box-arrow-in-right me-2"></i> Sign In
          </button>
        </div>
      </form>

      <div class="text-center pt-2 border-top">
        <span class="text-muted small">Don't have an account?</span>
        <a routerLink="/signup" class="btn btn-link p-0 ms-1 small fw-semibold">Create Account</a>
      </div>
    </div>
  </div>
</div>
