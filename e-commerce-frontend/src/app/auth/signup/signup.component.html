<div class="container d-flex justify-content-center align-items-center min-vh-100 py-5">
  <div class="card shadow-lg border-0 p-4 p-md-5" style="width: 100%; max-width: 460px; border-radius: 20px;">
    <div class="card-body p-0">
      
      <!-- Icon & Header -->
      <div class="text-center mb-4">
        <div class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-circle shadow-sm mb-3" style="width: 56px; height: 56px; background: linear-gradient(135deg, #10b981, #4f46e5) !important;">
          <i class="bi bi-person-plus-fill fs-3"></i>
        </div>
        <h3 class="card-title fw-bold text-dark mb-1">Create Account</h3>
        <p class="text-muted small">Join CloudCart for seamless shopping & orders</p>
      </div>

      <form (ngSubmit)="signup()" #signupForm="ngForm">
        <div class="mb-3">
          <label for="username" class="form-label small fw-semibold text-secondary">Username</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0 rounded-start-pill text-muted px-3">
              <i class="bi bi-person"></i>
            </span>
            <input
              type="text"
              id="username"
              [(ngModel)]="username"
              name="username"
              class="form-control bg-light border-start-0 rounded-end-pill py-2"
              placeholder="Choose a username"
              required />
          </div>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label small fw-semibold text-secondary">Email Address</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0 rounded-start-pill text-muted px-3">
              <i class="bi bi-envelope"></i>
            </span>
            <input
              type="email"
              id="email"
              [(ngModel)]="email"
              name="email"
              class="form-control bg-light border-start-0 rounded-end-pill py-2"
              placeholder="name@example.com"
              required />
          </div>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label small fw-semibold text-secondary">Password</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0 rounded-start-pill text-muted px-3">
              <i class="bi bi-lock"></i>
            </span>
            <input
              type="password"
              id="password"
              [(ngModel)]="password"
              name="password"
              class="form-control bg-light border-start-0 rounded-end-pill py-2"
              placeholder="Create strong password"
              required />
          </div>
        </div>

        <div class="mb-4">
          <label for="confirmPassword" class="form-label small fw-semibold text-secondary">Confirm Password</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0 rounded-start-pill text-muted px-3">
              <i class="bi bi-shield-check"></i>
            </span>
            <input
              type="password"
              id="confirmPassword"
              [(ngModel)]="confirmPassword"
              name="confirmPassword"
              class="form-control bg-light border-start-0 rounded-end-pill py-2"
              placeholder="Confirm your password"
              required />
          </div>
        </div>

        <div class="d-grid mb-3">
          <button type="submit" class="btn btn-primary rounded-pill py-2.5 fw-semibold shadow-sm">
            <i class="bi bi-person-plus me-2"></i> Register Account
          </button>
        </div>
      </form>

      <div class="text-center pt-2 border-top">
        <span class="text-muted small">Already have an account?</span>
        <a routerLink="/login" class="btn btn-link p-0 ms-1 small fw-semibold">Sign In</a>
      </div>
    </div>
  </div>
</div>
